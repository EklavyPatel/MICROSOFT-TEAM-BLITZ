services:
  - type: web
    name: cinematics-mstc
    runtime: node
    plan: starter
    buildCommand: node --check server.js
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 24.19.0
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: DATA_DIR
        value: /var/data/cinematics
    disk:
      name: cinematics-data
      mountPath: /var/data
      sizeGB: 1
